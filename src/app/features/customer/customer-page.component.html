<section class="page-header">
  <div>
    <p class="eyebrow">Customer experience</p>
    <h1>Build your coffee order</h1>
  </div>
</section>
@if (isLoading) {
  <div class="loading-state">Loading drinks and toppings...</div>
} @else {
  <div class="content-grid">
   
      <div class="menu-panel drinks-scroll">
        <app-catalog-list
          [drinks]="drinks"
          [toppings]="toppings"
          [showToppings]="false"
          [selectedToppings]="selectedToppings"
          (addToCart)="addToCart($event)"
          (toppingToggled)="toggleTopping($event)"
        />
      </div>

      @if (drinks.length > 0) {
        <app-cart
          (orderSuccess)="onCartSuccess($event)"
          (orderError)="onCartError($event)"
        />
      }
 
  </div>
}
